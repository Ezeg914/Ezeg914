<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="t">
  <title id="t">Welding-IA</title>
  <defs>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#121C33"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2A47"/>
      <stop offset="1" stop-color="#162038"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="arc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF7D6"/>
      <stop offset="0.4" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="360" height="220" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="360" height="220" fill="url(#bg)"/>
    <circle cx="296" cy="80" r="120" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="358.5" height="218.5" rx="15.5" fill="none" stroke="#24314F" stroke-width="1.5"/>

  <!-- Dos chapas y el cordón de soldadura -->
  <rect x="36" y="34" width="288" height="44" rx="6" fill="url(#plate)" stroke="#2A3857" stroke-width="1.5"/>
  <rect x="36" y="82" width="288" height="44" rx="6" fill="url(#plate)" stroke="#2A3857" stroke-width="1.5"/>
  <g fill="#3A4A6D" stroke="#56678F" stroke-width="1.2">
    <circle cx="52" cy="80" r="9"/><circle cx="64" cy="80" r="9"/><circle cx="76" cy="80" r="9"/>
    <circle cx="88" cy="80" r="9"/><circle cx="100" cy="80" r="9"/><circle cx="112" cy="80" r="9"/>
    <circle cx="124" cy="80" r="9"/><circle cx="136" cy="80" r="9"/><circle cx="148" cy="80" r="9"/>
    <circle cx="160" cy="80" r="9"/><circle cx="172" cy="80" r="9"/><circle cx="184" cy="80" r="9"/>
    <circle cx="196" cy="80" r="9"/><circle cx="208" cy="80" r="9"/><circle cx="220" cy="80" r="9"/>
    <circle cx="232" cy="80" r="9"/><circle cx="244" cy="80" r="9"/><circle cx="256" cy="80" r="9"/>
    <circle cx="268" cy="80" r="9"/><circle cx="280" cy="80" r="9"/>
  </g>

  <!-- Arco -->
  <circle cx="296" cy="80" r="16" fill="url(#arc)">
    <animate attributeName="r" dur="0.9s" repeatCount="indefinite" values="13;19;14;18;13"/>
  </circle>
  <g stroke="#FBBF24" stroke-width="2" stroke-linecap="round">
    <line x1="306" y1="66" x2="314" y2="55"><animate attributeName="opacity" dur="0.7s" repeatCount="indefinite" values="1;0;1"/></line>
    <line x1="311" y1="80" x2="324" y2="80"><animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="0;1;0"/></line>
    <line x1="306" y1="94" x2="314" y2="105"><animate attributeName="opacity" dur="0.6s" repeatCount="indefinite" values="1;0.1;1"/></line>
  </g>

  <!-- Recuadro de análisis recorriendo el cordón -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
      values="0 0;150 0;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <rect x="56" y="58" width="68" height="44" rx="5" fill="#F59E0B" fill-opacity="0.1"/>
    <path d="M56 70 V58 H68 M112 58 H124 V70 M124 90 V102 H112 M68 102 H56 V90" fill="none" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="24" y="152" width="30" height="4" rx="2" fill="#F59E0B"/>
  <text class="sans" x="23" y="192" font-size="30" font-weight="700" fill="#E6EDF7">Welding-IA</text>
</svg>
