<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Ezequiel Garcia: AI Engineer, Backend, Computer Vision</title>
  <desc id="d">Banner animado: un celular detecta un rostro en un video y el resultado se dibuja en un gráfico de radar de siete emociones.</desc>
  <defs>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#121C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="screenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18243F"/>
      <stop offset="1" stop-color="#0E1628"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1C2843"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <clipPath id="screen"><rect x="7" y="7" width="136" height="256" rx="18"/></clipPath>
    <clipPath id="type1">
      <rect x="92" y="232" height="36" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;168;168;0;0" keyTimes="0;0.12;0.29;0.33;1"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="92" y="232" height="36" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;252;252;0;0" keyTimes="0;0.34;0.47;0.62;0.66;1"/>
      </rect>
    </clipPath>
    <clipPath id="type3">
      <rect x="92" y="232" height="36" width="0">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;228;228;0;0" keyTimes="0;0.67;0.80;0.95;0.99;1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="110" cy="20" r="300" fill="url(#glowViolet)"/>
    <circle cx="1020" cy="160" r="260" fill="url(#glowCyan)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="19.5" fill="none" stroke="#24314F" stroke-width="1.5"/>

  <!-- Texto -->
  <text class="sans" x="64" y="98" font-size="22" fill="#8B9AB5">Hola, soy</text>
  <text class="sans" x="62" y="162" font-size="62" font-weight="700" fill="#E6EDF7">Ezequiel Garcia</text>
  <text class="sans" x="64" y="206" font-size="27" font-weight="600" fill="url(#accent)">AI Engineer · Backend · Computer Vision</text>

  <text class="mono" x="64" y="257" font-size="22" font-weight="700" fill="#22D3EE">&gt;</text>
  <g class="mono" font-size="22" fill="#C7D2E5">
    <text x="92" y="257" textLength="168" clip-path="url(#type1)">Flutter + Dart</text>
    <text x="92" y="257" textLength="252" clip-path="url(#type2)">FastAPI · Spring Boot</text>
    <text x="92" y="257" textLength="228" clip-path="url(#type3)">TensorFlow · OpenCV</text>
  </g>
  <rect x="96" y="238" width="11" height="24" rx="1.5" fill="#22D3EE">
    <animate attributeName="x" dur="10s" repeatCount="indefinite"
      values="96;264;264;96;96;348;348;96;96;324;324;96;96"
      keyTimes="0;0.12;0.29;0.33;0.34;0.47;0.62;0.66;0.67;0.80;0.95;0.99;1"/>
    <animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="1;1;0.15;0.15" keyTimes="0;0.5;0.55;1"/>
  </rect>

  <!-- Celular con detección de rostro -->
  <g transform="translate(670 25)">
    <rect width="150" height="270" rx="24" fill="#080D19" stroke="#3A4A6D" stroke-width="2"/>
    <rect x="7" y="7" width="136" height="256" rx="18" fill="url(#screenFill)"/>
    <g clip-path="url(#screen)">
      <circle cx="75" cy="118" r="30" fill="#2D3D62"/>
      <path d="M22 263 V228 Q22 170 75 170 Q128 170 128 228 V263 Z" fill="#2D3D62"/>
    </g>
    <rect x="55" y="14" width="40" height="6" rx="3" fill="#080D19"/>
    <circle cx="24" cy="32" r="4" fill="#F87171">
      <animate attributeName="opacity" dur="1.4s" repeatCount="indefinite" values="1;0.2;1"/>
    </circle>

    <line x1="42" x2="108" y1="84" y2="84" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <animate attributeName="y1" dur="2.6s" repeatCount="indefinite" values="86;150;86" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
      <animate attributeName="y2" dur="2.6s" repeatCount="indefinite" values="86;150;86" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </line>
    <path d="M38 95 V81 H52 M98 81 H112 V95 M112 141 V155 H98 M52 155 H38 V141" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="1;0.5;1"/>
    </path>
    <rect x="29" y="50" width="92" height="22" rx="6" fill="#22D3EE"/>
    <text class="mono" x="75" y="66" font-size="13" font-weight="700" text-anchor="middle" fill="#06202A">happy 0.87</text>

    <rect x="22" y="240" width="106" height="5" rx="2.5" fill="#2A3857"/>
    <rect x="22" y="240" width="0" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;106"/>
    </rect>
  </g>

  <!-- Flujo de datos -->
  <line x1="830" y1="160" x2="930" y2="160" stroke="#3A4A6D" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
  <circle cy="160" r="4.5" fill="#22D3EE">
    <animate attributeName="cx" dur="1.8s" repeatCount="indefinite" values="830;930"/>
    <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>

  <!-- Radar de 7 emociones -->
  <g transform="translate(1020 160)">
    <polygon points="0,-90 70.4,-56.1 87.7,20 39.1,81.1 -39.1,81.1 -87.7,20 -70.4,-56.1" fill="#0E1628" fill-opacity="0.6" stroke="#2A3857" stroke-width="1.5"/>
    <polygon points="0,-60 46.9,-37.4 58.5,13.4 26,54.1 -26,54.1 -58.5,13.4 -46.9,-37.4" fill="none" stroke="#24314F" stroke-width="1.2"/>
    <polygon points="0,-30 23.5,-18.7 29.2,6.7 13,27 -13,27 -29.2,6.7 -23.5,-18.7" fill="none" stroke="#24314F" stroke-width="1.2"/>
    <g stroke="#24314F" stroke-width="1.2">
      <line x2="0" y2="-90"/><line x2="70.4" y2="-56.1"/><line x2="87.7" y2="20"/><line x2="39.1" y2="81.1"/>
      <line x2="-39.1" y2="81.1"/><line x2="-87.7" y2="20"/><line x2="-70.4" y2="-56.1"/>
    </g>
    <polygon fill="url(#accent)" fill-opacity="0.3" stroke="#22D3EE" stroke-width="2.5" stroke-linejoin="round"
      points="0,-81 35.2,-28 61.4,14 13.7,28.4 -23.4,48.7 -35.1,8 -52.8,-42.1">
      <animate attributeName="points" dur="7s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
        values="0,-81 35.2,-28 61.4,14 13.7,28.4 -23.4,48.7 -35.1,8 -52.8,-42.1;
                0,-49.5 59.8,-47.7 35.1,8 27.3,56.8 -13.7,28.4 -70.2,16.1 -35.2,-28;
                0,-81 35.2,-28 61.4,14 13.7,28.4 -23.4,48.7 -35.1,8 -52.8,-42.1"/>
    </polygon>
    <circle r="3" fill="#22D3EE"/>
    <g class="mono" font-size="14" fill="#8B9AB5">
      <text x="0" y="-100" text-anchor="middle">happy</text>
      <text x="79" y="-62">surprised</text>
      <text x="97" y="27">neutral</text>
      <text x="44" y="101">sad</text>
      <text x="-44" y="101" text-anchor="end">fearful</text>
      <text x="-97" y="27" text-anchor="end">disgusted</text>
      <text x="-79" y="-62" text-anchor="end">angry</text>
    </g>
  </g>
</svg>
